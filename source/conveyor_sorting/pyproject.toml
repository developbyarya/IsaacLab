# Target Environment: Isaac Sim 6.2.0, Isaac Lab 3.0.0, Python 3.12, PhysX Backend

[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor_sorting"
version = "0.1.0"
description = "Isaac Lab dynamic sorting environment with conveyor belt and object pooling."
license = {text = "BSD-3-Clause"}
authors = [{name = "Gradiva Arya Wicaksana"}]
maintainers = [{name = "Gradiva Arya Wicaksana"}]
keywords = ["isaaclab", "conveyor", "vla", "dynamic-grasping"]
requires-python = ">=3.12"
dependencies = [
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_tasks",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_assets = { path = "../isaaclab_assets", editable = true }
isaaclab_tasks = { path = "../isaaclab_tasks", editable = true }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["conveyor_sorting", "conveyor_sorting.*"]
